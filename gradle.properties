# The JDK this project compiles with, in ONE place.
#
# The build's toolchain reads it (`kotlin { jvmToolchain(...) }` in build.gradle.kts) and the
# build's own JDK guard reads it (gradle/jdk-guard.gradle). The guard runs BEFORE the build
# script can be compiled — under a JDK the embedded Kotlin DSL compiler cannot parse, the
# build script itself cannot be compiled — so the answer cannot live in build.gradle.kts: it
# has to live where the guard and the build script both read it, written once.
pipelinek.acp.jvmToolchain=21
